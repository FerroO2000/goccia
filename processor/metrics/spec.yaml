package: metrics
attribute_sets:
  - name: error_type
    attributes:
      - name: error.type
        type: string
        arg: errType

bucket_bounds_sets:
  - name: micro_to_10_second
    lower_bound: 0.000001
    upper_bound: 10

groups:
  - name: aggregate_stage
    metrics:
      - name: aggregate_messages
        type: counter

  - name: can_stage
    metrics:
      - name: can_messages
        type: counter
      - name: can_signals
        type: counter

  - name: filter_stage
    metrics:
      - name: filtered_messages
        type: counter

  - name: json_encoder
    metrics:
      - name: goccia.json.encoder.operation.duration
        type: histogram
        data_type: float
        unit: s
        attribute_set: error_type
        bucket_bounds_set: micro_to_10_second

      - name: goccia.json.encoder.output.size
        type: histogram
        unit: By

  - name: json_decoder
    metrics:
      - name: goccia.json.decoder.operation.duration
        type: histogram
        data_type: float
        unit: s
        attribute_set: error_type
        bucket_bounds_set: micro_to_10_second

      - name: goccia.json.decoder.input.size
        type: histogram
        unit: By
        attribute_set: error_type

  - name: tee_stage
    metrics:
      - name: cloned_messages
        type: counter

  - name: rob_stage
    metrics:
      - name: ordered_messages
        type: counter
      - name: primary_enqueued_messages
        type: counter
      - name: auxiliary_enqueued_messages
        type: counter
      - name: out_of_order_sequence_number
        type: counter
      - name: duplicated_sequence_number
        type: counter
      - name: invalid_sequence_number
        type: counter
      - name: resets
        type: counter

  - name: router_stage
    metrics:
      - name: total_routed_messages
        type: counter
