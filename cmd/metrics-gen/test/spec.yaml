package: output
groups:
  - name: processor_stage
    metrics:
      - name: counted_items
        type: counter

      - name: current_items
        type: upDownCounter

      - name: my_gauge
        type: gauge

  - name: egress_stage
    metrics:
      - name: counted_items
        type: counter

      - name: current_items
        type: upDownCounter

      - name: int_histogram
        type: histogram
        data_type: integer

      - name: float_histogram
        type: histogram
        data_type: float