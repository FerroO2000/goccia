package: metrics

attribute_sets:
  - name: http_semconv
    attributes:
      - name: http.request.method
        type: string
        arg: requestMethod
      - name: url.scheme
        type: string
        arg: urlScheme
      - name: http.response.status_code
        type: int
        arg: statusCode
      - name: network.protocol.version
        type: string
        arg: protocolVersion

groups:
  - name: ebpf_stage
    metrics:
      - name: received_records
        type: counter
      - name: parsing_errors
        type: counter
      - name: received_bytes
        type: counter

  - name: file_stage
    metrics:
      - name: readers
        type: upDownCounter
      - name: active_readers
        type: upDownCounter
      - name: read_bytes
        type: counter

  - name: http_stage
    metrics:
      - name: http.server.request.duration
        description: Duration of HTTP server requests from handler entry until the response is written.
        type: histogram
        data_type: float
        unit: s
        bucket_bounds:
          [
            0.0001,
            0.00025,
            0.0005,
            0.001,
            0.0025,
            0.005,
            0.01,
            0.025,
            0.05,
            0.1,
            0.25,
            0.5,
            1,
            2.5,
            5,
            10,
          ]
        attribute_set: http_semconv

      - name: http.server.active_requests
        description: Number of HTTP server requests currently being handled.
        type: upDownCounter
        unit: "{request}"

      - name: http.server.request.body.size
        description: Size of HTTP request bodies observed by the server, including partially read bodies.
        type: histogram
        unit: By
        attribute_set: http_semconv

      - name: http.server.response.body.size
        description: Size of HTTP response bodies successfully written by the server.
        type: histogram
        unit: By
        attribute_set: http_semconv

      - name: goccia.http.ingress.queue.len
        description: Number of HTTP request messages currently waiting in the ingress output queue.
        type: gauge
        unit: "{message}"

      - name: goccia.http.ingress.queue.wait.duration
        description: Time spent waiting to enqueue an HTTP request message for downstream processing.
        type: histogram
        data_type: float
        unit: s
        bucket_bounds:
          [
            0.0001,
            0.00025,
            0.0005,
            0.001,
            0.0025,
            0.005,
            0.01,
            0.025,
            0.05,
            0.1,
            0.25,
            0.5,
            1,
            2.5,
            5,
            10,
          ]
        attributes:
          - name: outcome
            type: string

      - name: goccia.http.ingress.pending_responses
        description: Number of HTTP requests currently awaiting a downstream response.
        type: upDownCounter
        unit: "{request}"

      - name: goccia.http.ingress.response.wait.duration
        description: Time spent waiting for a downstream response after a successful queue handoff.
        type: histogram
        data_type: float
        unit: s
        bucket_bounds:
          [
            0.0001,
            0.00025,
            0.0005,
            0.001,
            0.0025,
            0.005,
            0.01,
            0.025,
            0.05,
            0.1,
            0.25,
            0.5,
            1,
            2.5,
            5,
            10,
          ]
        attributes:
          - name: outcome
            type: string

  - name: kafka_stage
    metrics:
      - name: received_messages
        type: counter
      - name: received_bytes
        type: counter

  - name: tcp_stage
    metrics:
      - name: open_connections
        type: upDownCounter
      - name: received_messages
        type: counter
      - name: received_bytes
        type: counter

  - name: ticker_stage
    metrics:
      - name: triggered_messages
        type: counter

  - name: udp_stage
    metrics:
      - name: received_messages
        type: counter
      - name: received_bytes
        type: counter
