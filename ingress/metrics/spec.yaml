package: metrics
groups:
  - name: ebpf_stage
    metrics:
      - name: received_records
        type: counter
      - name: parsing_errors
        type: counter
      - name: received_bytes
        type: counter

  - name: file_stage
    metrics:
      - name: readers
        type: upDownCounter
      - name: active_readers
        type: upDownCounter
      - name: read_bytes
        type: counter

  - name: http_stage
    metrics:
      - name: http.server.request.duration
        type: histogram
        data_type: float
        unit: s
      - name: http.server.active_requests
        type: upDownCounter
        unit: "{request}"
      - name: http.server.request.body.size
        type: histogram
        unit: By
      - name: http.server.response.body.size
        type: histogram
        unit: By
      - name: goccia.http.ingress.queue.len
        type: gauge
        unit: "{message}"
      - name: goccia.http.ingress.queue.wait.duration
        type: histogram
        data_type: float
        unit: s
      - name: goccia.http.ingress.pending_responses
        type: upDownCounter
        unit: "{request}"
      - name: goccia.http.ingress.response.wait.duration
        type: histogram
        data_type: float
        unit: s

  - name: kafka_stage
    metrics:
      - name: received_messages
        type: counter
      - name: received_bytes
        type: counter

  - name: tcp_stage
    metrics:
      - name: open_connections
        type: upDownCounter
      - name: received_messages
        type: counter
      - name: received_bytes
        type: counter

  - name: ticker_stage
    metrics:
      - name: triggered_messages
        type: counter

  - name: udp_stage
    metrics:
      - name: received_messages
        type: counter
      - name: received_bytes
        type: counter
